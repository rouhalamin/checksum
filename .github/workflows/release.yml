name: Build & Release CheckSum

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.3.0)'
        required: true
        default: '1.3.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Create GitHub Release
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set Release Version
        id: get_version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
            echo "TAG=v${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$VERSION" >> $GITHUB_ENV
            echo "TAG=v$VERSION" >> $GITHUB_ENV
          fi

      - name: Set up Node.js for Web Build
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web Dependencies & Build
        run: |
          npm ci || npm install
          npm run build

      - name: Check for Cargo.toml
        id: check_rust
        shell: bash
        run: |
          if [ -f "Cargo.toml" ]; then
            echo "has_rust=true" >> $GITHUB_OUTPUT
          else
            echo "has_rust=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Windows Executable (Rust)
        if: steps.check_rust.outputs.has_rust == 'true'
        run: |
          cargo build --release --locked

      - name: Calculate CheckSum SHA-256
        id: calc_hash
        shell: pwsh
        run: |
          if (Test-Path "target\release\CheckSum.exe") {
            $hash = (Get-FileHash -Path "target\release\CheckSum.exe" -Algorithm SHA256).Hash.ToLower()
            $size = (Get-Item "target\release\CheckSum.exe").Length
            echo "HASH=$hash" >> $env:GITHUB_ENV
            echo "FILE_SIZE=$size" >> $env:GITHUB_ENV
            echo "Calculated SHA-256: $hash"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CheckSum ${{ env.TAG }}
          body: |
            ### CheckSum ${{ env.TAG }}
            Native multi-algorithm file integrity verifier & checksum calculator.

            #### Release Assets:
            - **CheckSum.exe** (Windows 10 / 11 Native)
            - **SHA-256 Digest**: `${{ env.HASH }}`

            #### What's New:
            - Modern Glassmorphism & Fluent Acrylic interface with fluid animations
            - Maximum throughput streaming calculation engine
            - Real-time telemetry, ETA, and speed metrics
            - Multi-algorithm support (SHA-256, SHA-384, SHA-512, SHA-1, MD5, BLAKE2b, BLAKE3)
          files: |
            target/release/CheckSum.exe
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
